name: CD

# Push to main -> test + build -> deploy staging.
#
# Staging is the only environment. There is deliberately no production job:
# adding one later means restoring the deploy-prod job (see git history),
# applying the env stack with a prod tfvars, and re-adding the prod subject to
# the CI role's OIDC trust policy.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "**.po"
      - "**.pot"
      - "crowdin.yml"
      - ".mergify.yml"
      - "infra/terraform/**"
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Skip the test gate (hotfix only)"
        type: boolean
        default: false

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false # never interrupt a half-finished deploy

permissions:
  contents: read
  id-token: write # required for AWS OIDC

env:
  AWS_REGION: af-south-1
  PROJECT: corebyte
  # Pinned to a commit, not a branch. Tracking `main` meant an upstream change
  # to the Containerfile's interface silently changed our image: it moved
  # apps.json from a build arg to a BuildKit secret, so the arg was ignored,
  # bench init installed frappe alone, and the failure only surfaced at
  # `bench new-site` with ModuleNotFoundError: No module named 'erpnext'.
  # Bump this deliberately and re-test.
  FRAPPE_DOCKER_REF: 3562e512582d2e6eef18225d25e3a0532ee9dc00
  FRAPPE_BRANCH: develop
  # Used by the test job only. The image build deliberately does NOT override
  # the Containerfile's own PYTHON_VERSION/NODE_VERSION defaults (3.14.2 /
  # 24.13.0) -- upstream tests that pairing, and overriding NODE_VERSION with
  # a non-exact version previously broke the build, since the Containerfile
  # puts $NVM_DIR/versions/node/v${NODE_VERSION}/bin on PATH.
  PYTHON_VERSION: "3.14"
  NODE_VERSION: "24"

jobs:
  # ---------------------------------------------------------------------------
  test:
    name: Tests ${{ matrix.container }}
    if: ${{ !inputs.skip_tests }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: true # a red shard means nothing ships; stop burning minutes
      matrix:
        container: [1, 2, 3]

    services:
      mysql:
        image: mariadb:11.3
        env:
          MARIADB_ROOT_PASSWORD: "root"
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          check-latest: true

      - name: Add to Hosts
        run: echo "127.0.0.1 test_site" | sudo tee -a /etc/hosts

      - name: Install
        run: bash ${GITHUB_WORKSPACE}/.github/helper/install.sh
        env:
          BRANCH_TO_CLONE: ${{ github.ref_name }}

      - name: Run Tests
        run: |
          cd ~/frappe-bench/
          bench --site test_site run-parallel-tests \
            --app lending \
            --total-builds ${{ strategy.job-total }} \
            --build-number ${{ matrix.container }} \
            --lightmode
        env:
          TYPE: server

  # ---------------------------------------------------------------------------
  build:
    name: Build image
    # Native arm64 runner -- free on public repos. On a private repo either
    # switch this to a paid arm64 larger runner or fall back to
    # ubuntu-latest + QEMU (docker/setup-qemu-action), which takes ~4x longer.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    outputs:
      image: ${{ steps.meta.outputs.image }}

    steps:
      - uses: actions/checkout@v6

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Fetch frappe_docker build context
        run: |
          # A pinned commit is not fetchable by --branch, so clone then check out.
          git clone --filter=blob:none https://github.com/frappe/frappe_docker frappe_docker
          git -C frappe_docker checkout --detach "$FRAPPE_DOCKER_REF"

      - name: Verify the Containerfile still consumes apps.json as a secret
        run: |
          # Guard against the interface drifting again on a future bump. If
          # this fails, the image would build "successfully" with frappe only
          # and the problem would not surface until bench new-site.
          grep -q 'id=apps_json,target=/opt/frappe/apps.json' \
            frappe_docker/images/custom/Containerfile \
            || { echo "::error::Containerfile no longer mounts apps.json as the apps_json secret. Re-check how apps are passed before bumping FRAPPE_DOCKER_REF."; exit 1; }

      - id: meta
        run: echo "image=${{ steps.ecr.outputs.registry }}/${PROJECT}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./frappe_docker
          file: ./frappe_docker/images/custom/Containerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.ecr.outputs.registry }}/${{ env.PROJECT }}:main
          build-args: |
            FRAPPE_PATH=https://github.com/frappe/frappe
            FRAPPE_BRANCH=${{ env.FRAPPE_BRANCH }}
          # The Containerfile mounts this at /opt/frappe/apps.json and passes it
          # to `bench init --apps_path`. It is a secret mount, not a build arg,
          # so unlike a build arg it is not baked into image metadata.
          secret-files: |
            apps_json=${{ github.workspace }}/docker/apps.json
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  deploy-staging:
    name: Deploy staging
    needs: [test, build]
    # Still deploy when tests were explicitly skipped for a hotfix.
    if: ${{ always() && needs.build.result == 'success' && (needs.test.result == 'success' || inputs.skip_tests) }}
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v6
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: deploy
        uses: ./.github/actions/ssm-deploy
        with:
          environment: staging
          image: ${{ needs.build.outputs.image }}
          project: ${{ env.PROJECT }}
          region: ${{ env.AWS_REGION }}
