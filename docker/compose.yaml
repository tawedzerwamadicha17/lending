# Single-node Frappe Lending stack.
#
# Everything (db, redis, workers, web) runs on one EC2 host to keep cost at a
# minimum. Sized for 2 GiB RAM -- see the tuning notes on `db` and `backend`
# before raising worker counts.
#
# Base file publishes the app on host :80 with no TLS. Layer
# compose.traefik.yaml on top once a real domain points at the box.

x-image: &image
  image: ${IMAGE:?IMAGE must be set to the full ECR image URI}
  pull_policy: always
  restart: unless-stopped

x-backend: &backend
  <<: *image
  volumes:
    - sites:/home/frappe/frappe-bench/sites
    - logs:/home/frappe/frappe-bench/logs
  depends_on:
    configurator:
      condition: service_completed_successfully

services:
  # One-shot: writes db/redis coordinates into common_site_config.json inside
  # the sites volume, then exits. Every other service waits on it.
  configurator:
    <<: *image
    restart: "no"
    entrypoint: ["bash", "-c"]
    command:
      - >
        ls -1 apps > sites/apps.txt;
        bench set-config -g db_host $$DB_HOST;
        bench set-config -gp db_port $$DB_PORT;
        bench set-config -g redis_cache "redis://$$REDIS_CACHE";
        bench set-config -g redis_queue "redis://$$REDIS_QUEUE";
        bench set-config -g redis_socketio "redis://$$REDIS_QUEUE";
        bench set-config -gp socketio_port $$SOCKETIO_PORT;
        bench set-config -g maintenance_mode 0;
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      REDIS_CACHE: redis-cache:6379
      REDIS_QUEUE: redis-queue:6379
      SOCKETIO_PORT: "9000"
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      db:
        condition: service_healthy
      redis-cache:
        condition: service_started
      redis-queue:
        condition: service_started

  backend:
    <<: *backend
    # Default CMD runs gunicorn. Two gthread workers is the ceiling on a 2 GiB
    # box; each is ~150-200 MB resident.
    environment:
      BACKEND_WORKERS: "2"
      BACKEND_THREADS: "4"

  frontend:
    <<: *image
    command: ["nginx-entrypoint.sh"]
    environment:
      BACKEND: backend:8000
      SOCKETIO: websocket:9000
      # Single site per host, so pin the header rather than deriving it from
      # $$host -- this keeps the box reachable by raw IP before DNS exists.
      FRAPPE_SITE_NAME_HEADER: ${SITE_NAME:?SITE_NAME must be set}
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      PROXY_READ_TIMEOUT: "120"
      CLIENT_MAX_BODY_SIZE: 50m
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    # No host port binding here on purpose. Whichever overlay is layered on
    # top publishes it: compose.ports.yaml binds :80 directly, and
    # compose.traefik.yaml puts Traefik in front instead. Compose merges
    # `ports` by appending rather than replacing, so declaring it here would
    # force the TLS overlay to clear it with a custom !override tag -- which
    # in turn breaks the repo's check-yaml pre-commit hook.
    depends_on:
      - backend
      - websocket

  websocket:
    <<: *image
    command: ["node", "/home/frappe/frappe-bench/apps/frappe/socketio.js"]
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      configurator:
        condition: service_completed_successfully

  # Lending's scheduled work (accruals, demands, classification) runs here.
  # See scheduler_events in lending/hooks.py -- if the scheduler is down,
  # no interest accrues.
  scheduler:
    <<: *backend
    command: ["bench", "schedule"]

  queue-short:
    <<: *backend
    command: ["bench", "worker", "--queue", "short,default"]

  queue-long:
    <<: *backend
    command: ["bench", "worker", "--queue", "long"]

  db:
    image: mariadb:11.3
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
      # 2 GiB host: leave headroom for the python processes.
      - --innodb-buffer-pool-size=256M
      - --max-connections=100
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD must be set}
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -u root -p$$MARIADB_ROOT_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    volumes:
      - db-data:/var/lib/mysql

  redis-cache:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]

  redis-queue:
    image: redis:7-alpine
    restart: unless-stopped
    # Queue data must survive a restart -- unlike the cache, losing it drops
    # enqueued background jobs.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-queue-data:/data

volumes:
  sites:
  logs:
  db-data:
  redis-queue-data:
